[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scdownloader2"
version = "0.1.0"
description = "Download SoundCloud tracks/playlists as MP3, via the SoundCloud API and ffmpeg directly."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "requests>=2.34",
    "loguru>=0.7",
    "unidecode>=1.4",
]

[project.scripts]
scdownloader2 = "scdownloader2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
